server:
  port: 8088

spring:
  application:
    name: TurnosMicroService

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB_TURNOS:turnos_db}?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=${MYSQL_USE_SSL:false}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        hibernate.type.preferred_uuid_jdbc_type: BINARY
        dialect: org.hibernate.dialect.MySQL8Dialect

# IMPORTANTE: Ahora apunta al Gateway, no directo al microservicio
usuarios:
  service:
    url: ${USUARIOS_SERVICE_URL:http://localhost:8089/usuarios} # En Docker: http://gateway:8089/usuarios


whatsapp:
  api:
    url: https://api.whatsapp.example/send
    token: ${WHATSAPP_API_TOKEN:TU_TOKEN_AQUI}

turnos:
  tolerancia-minutos: 10
  min-duration-minutes: 45
  buffer-minutes: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info