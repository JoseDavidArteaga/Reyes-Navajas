server:
  port: 8091

spring:
  application:
    name: microNotificacion

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}

twilio:
  account-sid: ${TWILIO_SID:xx}
  auth-token: ${TWILIO_TOKEN:xx}
  from-number: ${TWILIO_FROM:xx}

management:
  endpoints:
    web:
      exposure:
        include: health,info
