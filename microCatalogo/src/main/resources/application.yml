server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB_CATALOGO:catalogo_db}?useSSL=${MYSQL_USE_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}

app:
  base-url: ${APP_BASE_URL:http://localhost:8083}
  upload:
    dir: ${APP_UPLOAD_DIR:./uploads/servicios}
  rabbitmq:
    exchange: catalogo.exchange
    routingKey: catalogo.servicio.creado
    queue: catalogo.servicios.queue

management:
  endpoints:
    web:
      exposure:
        include: health,info