server:
  port: 8089 # Puerto del API Gateway

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:4200"
              - "http://localhost:5173"
              - "${CORS_ALLOWED_ORIGIN:https://tu-dominio.com}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
      routes:

        # ----------------------------------
        #  Microservicio de Catálogo
        # ----------------------------------
        - id: catalogo-service
          uri: ${CATALOGO_URL:http://localhost:8083}
          predicates:
            - Path=/catalogo/**

        # ----------------------------------
        #  Microservicio de Turnos
        # ----------------------------------
        - id: turnos-service
          uri: ${TURNOS_URL:http://localhost:8088}
          predicates:
            - Path=/turnos/**

        # ----------------------------------
        #  Microservicio de Usuarios
        # ----------------------------------
        - id: usuarios-service
          uri: ${USUARIOS_URL:http://localhost:8085}
          predicates:
            - Path=/usuarios/**
          filters:
            - StripPrefix=0

        # ----------------------------------
        #  Endpoints de Barberos (via Usuarios)
        # ----------------------------------
        - id: barberos-service
          uri: ${USUARIOS_URL:http://localhost:8085}
          predicates:
            - Path=/barberos/**
          filters:
              - RewritePath=/barberos/?(?<segment>.*), /usuarios/barberos/${segment}

        # ----------------------------------
        #  Microservicio de Autenticación
        # ----------------------------------
        - id: auth-service
          uri: ${AUTH_URL:http://localhost:8084}
          predicates:
            - Path=/auth/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/MicroservicesBarber}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/MicroservicesBarber/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG